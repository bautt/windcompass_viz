[package]
id = windcompass
# Must stay enabled for a Splunkbase-published app: Splunkbase rejects an
# upload with updates disabled, since this is how users are told a new
# version exists. (Set it to false only for a private app that is never
# published, which is the opposite case AppInspect's local check warns about.)
check_for_updates = true

[id]
version = 0.5.2
name = windcompass

[ui]
is_visible = 1
label = Wind Compass
show_in_nav = 1

[launcher]
author = Tomas Baublys
description = Animated wind compass for Dashboard Studio — live Open-Meteo data by city, or your own search. Direction, speed, temperature, and weather icon.
version = 0.5.2

[install]
is_configured = 0
requires_splunk = 10.4
build = <@- buildNumber @>

[manifest]
category = Custom
